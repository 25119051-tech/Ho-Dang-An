<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dành Riêng Cho Trương Gia Mỹ 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050106;
            color: #fff0f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Ambient Background Canvas */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main 3D Canvas */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: grab;
        }

        #heartCanvas:active {
            cursor: grabbing;
        }

        /* Screen 1: Intro Question */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(5, 1, 6, 0.85);
            backdrop-filter: blur(8px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .question-box {
            position: relative;
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(201, 24, 74, 0.2);
            max-width: 90%;
            width: 420px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            color: #ffb3c1;
            text-shadow: 0 0 12px #ff4d6d;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn-group {
            position: relative;
            width: 100%;
            height: 120px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #c9184a, #ff4d6d);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s ease, left 0.15s ease, top 0.15s ease;
            position: absolute;
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.8);
        }

        #btn-yes {
            left: 10%;
            top: 30px;
            z-index: 2;
        }

        #btn-no {
            left: 60%;
            top: 30px;
            background: linear-gradient(135deg, #3a0ca3, #4cc9f0);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.4);
            z-index: 1;
        }

        /* HUD Navigation Overlay */
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            display: none;
            gap: 12px;
        }

        .hud-btn {
            position: relative;
            padding: 10px 18px;
            font-size: 0.85rem;
            background: rgba(24, 10, 18, 0.7);
            border: 1px solid rgba(255, 77, 109, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            color: #ffccd5;
            cursor: pointer;
            transition: all 0.3s;
        }

        .hud-btn:hover {
            background: rgba(201, 24, 74, 0.6);
            color: #fff;
            box-shadow: 0 0 15px #ff4d6d;
        }

        /* Letter Modal */
        #modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 90%;
            max-width: 450px;
            background: rgba(15, 4, 11, 0.92);
            border: 1px solid #ff4d6d;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(255, 77, 109, 0.4);
            backdrop-filter: blur(10px);
        }

        #modal h2 {
            color: #ff88a5;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 8px #c9184a;
        }

        #letter-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #fff0f3;
            min-height: 140px;
            white-space: pre-wrap;
            border-top: 1px dashed rgba(255, 179, 193, 0.3);
            padding-top: 15px;
        }

        #close-modal {
            margin: 20px auto 0 auto;
            display: block;
            position: static;
        }

        #hint-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 204, 213, 0.5);
            z-index: 3;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <canvas id="heartCanvas"></canvas>

    <!-- Screen 1 -->
    <div id="intro-screen">
        <div class="question-box" id="question-box">
            <h1>Chị Trương Gia Mỹ đồng ý làm bạn em nha? 💕</h1>
            <div class="btn-group" id="btn-container">
                <button id="btn-yes" class="btn">Đồng ý 💖</button>
                <button id="btn-no" class="btn">Không ❌</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <button id="btn-music" class="hud-btn">Tắt Nhạc 🎵</button>
        <button id="btn-letter" class="hud-btn">Xem Thư 💌</button>
        <button id="btn-reset" class="hud-btn">Làm lại 🔄</button>
    </div>

    <div id="hint-text">✨ Nhấp và kéo chuột/tay để xoay trái tim 3D ✨</div>

    <!-- Modal -->
    <div id="modal">
        <h2>💌 THƯ TÌNH DÀNH RIÊNG CHO MỸ 💌</h2>
        <div id="letter-body"></div>
        <button id="close-modal" class="btn hud-btn">Đóng thư 💕</button>
    </div>

    <audio id="bgm" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=sweet-love-111578.mp3"></audio>

<script>
    const TARGET_NAME = "Trương Gia Mỹ";
    const letterTextContent = `Gửi chị ${TARGET_NAME},\n\nEm tạo chiếc app nhỏ này chỉ dành riêng cho chị thôi!\nCảm ơn chị vì đã luôn xuất hiện thật rạng rỡ và đem lại nhiều niềm vui.\n\nChúc chị luôn xinh đẹp, hạnh phúc và có những ngày thật ngọt ngào nha!\n\nFrom your secret admirer with 💖`;

    const introScreen = document.getElementById('intro-screen');
    const questionBox = document.getElementById('question-box');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const hud = document.getElementById('hud');
    const hintText = document.getElementById('hint-text');
    const btnLetter = document.getElementById('btn-letter');
    const btnReset = document.getElementById('btn-reset');
    const btnMusic = document.getElementById('btn-music');
    const modal = document.getElementById('modal');
    const letterBody = document.getElementById('letter-body');
    const closeModal = document.getElementById('close-modal');
    const bgm = document.getElementById('bgm');

    let yesScale = 1.0;

    // --- Sửa logic nút né tránh chuẩn xác ---
    function moveNoButton() {
        const boxRect = questionBox.getBoundingClientRect();
        const btnRect = btnNo.getBoundingClientRect();

        const maxX = boxRect.width - btnRect.width - 20;
        const maxY = boxRect.height - btnRect.height - 20;

        const newX = Math.max(10, Math.floor(Math.random() * maxX));
        const newY = Math.max(10, Math.floor(Math.random() * maxY));

        btnNo.style.left = `${newX}px`;
        btnNo.style.top = `${newY}px`;

        // Phóng to nút Đồng Ý mỗi lần nút Không né tránh
        yesScale += 0.1;
        if (yesScale < 2.2) {
            btnYes.style.transform = `scale(${yesScale})`;
        }
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveNoButton();
    });

    btnYes.addEventListener('click', startMainExperience);

    function startMainExperience() {
        introScreen.style.opacity = '0';
        setTimeout(() => {
            introScreen.style.visibility = 'hidden';
            hud.style.display = 'flex';
            hintText.style.display = 'block';
        }, 800);

        bgm.play().catch(() => { btnMusic.innerText = "Bật Nhạc 🎵"; });
    }

    btnMusic.addEventListener('click', () => {
        if (bgm.paused) {
            bgm.play();
            btnMusic.innerText = "Tắt Nhạc 🎵";
        } else {
            bgm.pause();
            btnMusic.innerText = "Bật Nhạc 🎵";
        }
    });

    // --- Background Ambient ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgParticles = [];

    function resizeBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
    }

    function initBgParticles() {
        bgParticles = [];
        for (let i = 0; i < 70; i++) {
            bgParticles.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.8 + 0.2,
                opacity: Math.random() * 0.6 + 0.2
            });
        }
    }

    function renderBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.fillStyle = '#ffb3c1';

        for (let p of bgParticles) {
            p.y += p.speedY;
            if (p.y > bgCanvas.height) p.y = 0;
            bgCtx.globalAlpha = p.opacity;
            bgCtx.beginPath();
            bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            bgCtx.fill();
        }
        requestAnimationFrame(renderBg);
    }

    // --- 3D Heart Engine ---
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let points = [];
    let rotX = 0.2, rotY = 0;
    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;
    const gradientColors = ["#200109", "#590d22", "#800f2f", "#a4133d", "#c9184a", "#ff4d6d", "#ff88a5", "#ffffff"];

    function initHeartPoints() {
        points = [];
        const isMobile = window.innerWidth < 768;
        const totalPoints = isMobile ? 2200 : 4200;

        for (let i = 0; i < totalPoints; i++) {
            let u = Math.random() * Math.PI * 2;
            let v = (Math.random() - 0.5) * Math.PI;
            
            let cosV = Math.pow(Math.abs(Math.cos(v)), 0.35);
            let x = 16 * Math.pow(Math.sin(u), 3) * cosV;
            let y = -(13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u)) * cosV;
            let z = 6.5 * Math.sin(v);

            let scale = Math.random() < 0.45 ? Math.cbrt(Math.random()) : 1.0;
            points.push({
                x: x * 9.5 * scale,
                y: y * 9.5 * scale,
                z: z * 9.5 * scale,
                baseSize: Math.random() > 0.85 ? 2.2 : 1.2
            });
        }
    }

    function resizeHeart() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    window.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let deltaX = e.clientX - lastMouseX;
        let deltaY = e.clientY - lastMouseY;
        rotY += deltaX * 0.005;
        rotX += deltaY * 0.005;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
        }
    });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        let deltaX = e.touches[0].clientX - lastMouseX;
        let deltaY = e.touches[0].clientY - lastMouseY;
        rotY += deltaX * 0.005;
        rotX += deltaY * 0.005;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', () => isDragging = false);

    let frameCount = 0;
    function renderHeart() {
        ctx.fillStyle = '#050106';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (!isDragging) {
            rotY += 0.008;
            rotX += 0.002;
        }

        frameCount++;
        let pulse = 1 + 0.07 * Math.sin(frameCount * 0.06);

        let projected = [];
        let fov = 480;

        for (let p of points) {
            let x = p.x * pulse;
            let y = p.y * pulse;
            let z = p.z * pulse;

            let x1 = x * Math.cos(rotY) + z * Math.sin(rotY);
            let z1 = -x * Math.sin(rotY) + z * Math.cos(rotY);

            let y2 = y * Math.cos(rotX) - z1 * Math.sin(rotX);
            let z2 = y * Math.sin(rotX) + z1 * Math.cos(rotX);

            let scale = fov / (z2 + fov + 220);
            let sx = x1 * scale + canvas.width / 2;
            let sy = y2 * scale + canvas.height / 2;

            if (sx >= 0 && sx < canvas.width && sy >= 0 && sy < canvas.height) {
                projected.push({
                    sx: sx,
                    sy: sy,
                    z: z2,
                    sz: Math.max(0.8, p.baseSize * scale)
                });
            }
        }

        projected.sort((a, b) => a.z - b.z);

        for (let p of projected) {
            let colorIdx = Math.floor(((p.z + 160) / 320) * (gradientColors.length - 1));
            colorIdx = Math.max(0, Math.min(gradientColors.length - 1, colorIdx));
            
            ctx.fillStyle = gradientColors[colorIdx];
            ctx.fillRect(p.sx, p.sy, p.sz, p.sz);
        }

        ctx.font = "bold 24px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255, 240, 243, 0.95)";
        ctx.shadowColor = "#ff4d6d";
        ctx.shadowBlur = 12;
        ctx.fillText(TARGET_NAME, canvas.width / 2, canvas.height / 2);
        ctx.shadowBlur = 0;

        requestAnimationFrame(renderHeart);
    }

    // --- Letter Typewriter ---
    btnLetter.addEventListener('click', () => {
        modal.style.display = 'block';
        letterBody.innerText = '';
        let index = 0;
        function type() {
            if (index < letterTextContent.length) {
                letterBody.innerText += letterTextContent.charAt(index);
                index++;
                setTimeout(type, 32);
            }
        }
        type();
    });

    closeModal.addEventListener('click', () => modal.style.display = 'none');

    // Reset
    btnReset.addEventListener('click', () => {
        modal.style.display = 'none';
        hud.style.display = 'none';
        hintText.style.display = 'none';
        introScreen.style.visibility = 'visible';
        introScreen.style.opacity = '1';
        btnNo.style.left = '60%';
        btnNo.style.top = '30px';
        yesScale = 1.0;
        btnYes.style.transform = 'scale(1)';
    });

    window.addEventListener('resize', () => {
        resizeBg();
        resizeHeart();
        initHeartPoints();
    });

    resizeBg();
    resizeHeart();
    initBgParticles();
    initHeartPoints();
    renderBg();
    renderHeart();
</script>
</body>
</html>
